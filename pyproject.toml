[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantai"
version = "5.1.0"
description = "QuantAI Professional - AI-driven Cryptocurrency Trading Platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Bahtiyorjon", email = "bahtiyorjon@example.com"}
]
keywords = ["quant", "trading", "crypto", "ml", "backtesting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "numpy==2.5.1",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "scikit-learn==1.9.0",
    "xgboost==3.3.0",
    "joblib==1.5.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.2",
    "typer==0.27.1",
    "rich==15.0.0",
    "ccxt==4.5.68",
    "aiohttp==3.14.1",
    "websockets==16.1.1",
    "prometheus-client>=0.21",
    "msgpack>=1.1",
    "zstandard>=0.23",
    "asyncpg==0.30.0",
    "cryptography==45.0.4",
    "redis==6.2.0",
    "catboost==1.3.4",
    "lightgbm==4.6.0",
    "scipy==1.15.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "pytest-json-report>=1.5",
    "ruff>=0.1.0",
    "mypy>=1.5",
    "pre-commit>=3.5",
]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "pytest-json-report>=1.5",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]

[project.urls]
Homepage = "https://github.com/bahtiyorjon/QuantAI"
Repository = "https://github.com/bahtiyorjon/QuantAI"
Issues = "https://github.com/bahtiyorjon/QuantAI/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*", "quantai*"]
exclude = ["tests*", "docs*", "scripts*", "experimental*", "notebooks*", "data*", "build*", "dist*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true