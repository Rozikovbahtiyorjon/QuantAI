# =========================================================
# QuantAI Professional - Testnet Docker Compose
# =========================================================

version: '3.8'

services:
  # =========================================================
  # QuantAI Main Application
  # =========================================================
  quantai:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: quantai-testnet
    hostname: quantai-testnet
    restart: unless-stopped
    user: "quantai"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - TZ=UTC
      # Binance Testnet Credentials (set via .env file)
      - BINANCE_TESTNET_API_KEY=${BINANCE_TESTNET_API_KEY}
      - BINANCE_TESTNET_API_SECRET=${BINANCE_TESTNET_API_SECRET}
      - BINANCE_TESTNET=true
      - LOG_LEVEL=DEBUG
      - ML_ENABLED=true
      - TELEGRAM_ENABLED=false
      - TZ=UTC
    env_file:
      - .env.testnet
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
      - ./checkpoints:/app/checkpoints
      - ./config:/app/config:ro
    ports:
      - "9090:9090"  # Prometheus metrics
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.path.insert(0, '/app'); from src.monitoring.health import HealthChecker; import asyncio; hc = HealthChecker(); result = asyncio.run(hc.health.liveness()); exit(0 if result['status'] == 'alive' else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    networks:
      - quantai-network

  # =========================================================
  # Prometheus Metrics Collection
  # =========================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: quantai-prometheus
    hostname: prometheus
    user: "65534:65534"  # nobody user
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - quantai-network
    restart: unless-stopped

  # =========================================================
  # Grafana Visualization
  # =========================================================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: quantai-grafana
    hostname: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - quantai-network
    restart: unless-stopped
    depends_on:
      - prometheus

  # =========================================================
  # Alertmanager for Alerting
  # =========================================================
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: quantai-alertmanager
    hostname: alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - quantai-network
    restart: unless-stopped

  # =========================================================
  # Redis for Caching/Session
  # =========================================================
  redis:
    image: redis:7-alpine
    container_name: quantai-redis
    hostname: redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - quantai-network
    restart: unless-stopped

  # =========================================================
  # PostgreSQL for Persistent Storage (optional)
  # =========================================================
  postgres:
    image: postgres:16-alpine
    container_name: quantai-postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=quantai
      - POSTGRES_USER=quantai
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-quantai123}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - quantai-network
    restart: unless-stopped

# =========================================================
# Networks
# =========================================================
networks:
  quantai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# =========================================================
# Volumes
# =========================================================
volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local
  redis-data:
    driver: local
  postgres-data:
    driver: local