# =========================================================
# QuantAI Professional - Testnet Docker Compose
# =========================================================

version: '3.8'

services:
  # =========================================================
  # QuantAI Main Application
  # =========================================================
  quantai:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: quantai-testnet
    hostname: quantai-testnet
    restart: unless-stopped
    user: "quantai"
    # Audit #28: BasePolicy → ProductionPolicy hierarchy; fail if secrets missing
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - TZ=UTC
      # Binance Testnet Credentials (set via .env file)
      - BINANCE_TESTNET_API_KEY=${BINANCE_TESTNET_API_KEY}
      - BINANCE_TESTNET_API_SECRET=${BINANCE_TESTNET_API_SECRET}
      - BINANCE_TESTNET=true
      - LOG_LEVEL=DEBUG
      - ML_ENABLED=true
      - TELEGRAM_ENABLED=false
      - TZ=UTC
    env_file:
      - .env.testnet
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
      - ./checkpoints:/app/checkpoints
      - ./config:/app/config:ro
    # SECURITY (Task 11): Bind metrics to localhost only — do not expose 9090 publicly.
    # For remote monitoring, use reverse proxy or expose via internal network only.
    ports:
      - "127.0.0.1:9090:9090"  # Prometheus metrics — localhost only, internal
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.path.insert(0, '/app'); from src.monitoring.health import HealthChecker; import asyncio; hc = HealthChecker(); result = asyncio.run(hc.health.liveness()); exit(0 if result['status'] == 'alive' else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    networks:
      - quantai-network

  # =========================================================
  # Prometheus Metrics Collection
  # =========================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: quantai-prometheus
    hostname: prometheus
    user: "65534:65534"  # nobody user
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # Audit §29: 9091 internal only for testnet local — use expose, not ports, for remote prod
    expose:
      - "9090"
    networks:
      - quantai-network
    restart: unless-stopped

  # =========================================================
  # Grafana Visualization — 3000 internal, expose via reverse proxy in prod
  # =========================================================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: quantai-grafana
    hostname: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set — missing secret → FAIL STARTUP}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    expose:
      - "3000"
    networks:
      - quantai-network
    restart: unless-stopped
    depends_on:
      - prometheus

  # =========================================================
  # Alertmanager for Alerting — internal only
  # =========================================================
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: quantai-alertmanager
    hostname: alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    expose:
      - "9093"
    networks:
      - quantai-network
    restart: unless-stopped

  # =========================================================
  # Redis for Caching/Session — NOT exposed (internal network only, Audit #29)
  # =========================================================
  redis:
    image: redis:7-alpine
    container_name: quantai-redis
    hostname: redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis-data:/data
    # ports intentionally removed — internal only
    expose:
      - "6379"
    networks:
      - quantai-network
    restart: unless-stopped

  # =========================================================
  # PostgreSQL for Persistent Storage (optional)
  # =========================================================
  postgres:
    image: postgres:16-alpine
    container_name: quantai-postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=quantai
      - POSTGRES_USER=quantai
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — missing secret → FAIL STARTUP}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    expose:
      - "5432"
    networks:
      - quantai-network
    restart: unless-stopped

  # =========================================================
  # Telegram Office Bot — 24/7 control plane (polling)
  # Profile: office — enable with: docker compose --profile office up -d telegram-office
  # For local PC: docker compose --profile office up -d telegram-office
  # =========================================================
  telegram-office:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: quantai-telegram-office
    hostname: telegram-office
    restart: unless-stopped
    profiles: ["office"]
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - TZ=UTC
      - TELEGRAM__ENABLED=${TELEGRAM__ENABLED:-false}
      - TELEGRAM__TOKEN=${TELEGRAM__TOKEN:-}
      - TELEGRAM__CHAT_ID=${TELEGRAM__CHAT_ID:-}
      - TELEGRAM__ADMIN_IDS=${TELEGRAM__ADMIN_IDS:-}
      - TELEGRAM__OFFICE_ENABLED=${TELEGRAM__OFFICE_ENABLED:-true}
      - TELEGRAM__TOPIC_MODE=${TELEGRAM__TOPIC_MODE:-false}
      - TELEGRAM__AGENT_TOKENS_JSON=${TELEGRAM__AGENT_TOKENS_JSON:-}
    env_file:
      - .env
      - .env.testnet
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config:ro
      - ./AGENTS:/app/AGENTS:ro
    command: ["python", "-m", "src.telegram.office_bot", "--polling"]
    depends_on:
      - quantai
    networks:
      - quantai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q \"[o]ffice_bot\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

# =========================================================
# Networks
# =========================================================
networks:
  quantai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# =========================================================
# Volumes
# =========================================================
volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local
  redis-data:
    driver: local
  postgres-data:
    driver: local